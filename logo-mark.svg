<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SILK Advisory monogram">
  <defs>
    <style>
      .mono { font-family: 'Italiana', 'Cormorant Garamond', serif; font-weight: 400; }
    </style>
  </defs>
  <circle cx="60" cy="60" r="58" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="0.5" opacity=".55"/>

  <!-- S monogram -->
  <text x="60" y="80" text-anchor="middle" class="mono" font-size="74" fill="currentColor">S</text>

  <!-- tiny serif marks -->
  <g fill="currentColor">
    <circle cx="60" cy="14"  r="1.2"/>
    <circle cx="60" cy="106" r="1.2"/>
  </g>
</svg>
