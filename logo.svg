<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="SILK Advisory">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500&amp;display=swap');
      .silk {
        font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-weight: 500;
      }
      .adv {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 400;
      }
      .micro {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        letter-spacing: .55em;
      }
    </style>
  </defs>

  <!-- Eyebrow -->
  <text x="400" y="48" text-anchor="middle" font-size="13" class="micro" fill="currentColor">ADVISORY · STOCKHOLM</text>

  <!-- SILK wordmark -->
  <text x="400" y="220" text-anchor="middle"
        class="silk" font-size="210" letter-spacing="10"
        fill="currentColor">SILK</text>

  <!-- Advisory italic -->
  <text x="400" y="300" text-anchor="middle"
        class="adv" font-size="58" letter-spacing="3"
        fill="currentColor">Advisory</text>
</svg>
